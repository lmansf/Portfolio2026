# Fails when data/console/site.sql (the tables behind the SQL console) is
# out of step with index.html, projects.html or data/console/extra.sql.
# Fix: python3 scripts/build_console_data.py, then commit site.sql.
name: Console data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check site.sql is current
        run: python3 scripts/build_console_data.py --check
