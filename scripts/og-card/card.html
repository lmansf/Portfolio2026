<!doctype html>
<!-- Source for assets/og-card.jpg (1200×630 social preview). Render with scripts/og-card/render.mjs. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(__TOOLS__/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(__TOOLS__/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(__TOOLS__/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:JBM;font-weight:500;src:url(__TOOLS__/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0c1116;color:#e9eef3;font-family:Inter,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(900px 520px at 88% -12%,rgba(34,211,238,.16),transparent 60%),
  radial-gradient(700px 420px at -8% 112%,rgba(125,211,252,.08),transparent 60%)}
.card{position:absolute;left:64px;right:64px;top:64px;bottom:64px;border-radius:28px;
  background:linear-gradient(180deg,#141b22,#1b242d);border:1px solid rgba(255,255,255,.17);
  box-shadow:0 18px 40px rgba(0,0,0,.28);display:flex;align-items:center;gap:52px;padding:0 60px;overflow:hidden}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:linear-gradient(135deg,transparent 55%,rgba(34,211,238,.22));opacity:.7}
.card>*{position:relative}
.tick{position:absolute;top:28px;right:28px;width:22px;height:22px;border-top:3px solid #22d3ee;border-right:3px solid #22d3ee}
.avatar{width:240px;height:240px;border-radius:50%;object-fit:cover;border:6px solid #22d3ee;box-shadow:0 10px 30px rgba(0,0,0,.35);flex-shrink:0}
.text{display:flex;flex-direction:column;gap:22px;min-width:0}
h1{font-size:88px;line-height:1;font-weight:800;letter-spacing:-.03em}
.role{font-size:38px;font-weight:600;color:#aab6c0}
.role b{color:#e9eef3;font-weight:600}
.chip{align-self:flex-start;font-family:JBM,monospace;font-weight:500;font-size:18px;white-space:nowrap;color:#aab6c0;background:#1b242d;border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:8px 18px}
.site{display:flex;align-items:center;gap:14px;font-family:JBM,monospace;font-weight:500;font-size:26px;color:#22d3ee;margin-top:6px}
.crow{width:44px;height:36px;background:#22d3ee;-webkit-mask:url(__ASSETS__/crow.png) center/contain no-repeat;mask:url(__ASSETS__/crow.png) center/contain no-repeat}
</style></head>
<body><div class="glow"></div>
<div class="card"><span class="tick"></span>
  <img class="avatar" src="__ASSETS__/profilepicture.webp" alt="">
  <div class="text">
    <h1>Logan Mansfield</h1>
    <p class="role"><b>Data Analyst</b> · Tampa, FL</p>
    <p class="chip">Microsoft Certified: Power BI Data Analyst (PL-300)</p>
    <p class="site"><span class="crow"></span>loganmansfield.org</p>
  </div>
</div></body></html>
