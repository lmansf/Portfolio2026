<title>Incident 404 Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Layout: a thin control bar over a framed copy of the real 404 page. */
:root {
    --bg: #eceeeb; --panel: #ffffff; --ink: #111b22; --muted: #4a5660; --line: #d4d9d6; --accent: #0f6f62; --on-accent: #ffffff;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --text: "Schibsted Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #070b0d; --panel: #131b20; --ink: #e8eef0; --muted: #a1adb3; --line: #2a353b; --accent: #4fd1b8; --on-accent: #0c1215; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #070b0d; --panel: #131b20; --ink: #e8eef0; --muted: #a1adb3; --line: #2a353b; --accent: #4fd1b8; --on-accent: #0c1215; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; display: grid; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.bar h1 { font-size: 15px; font-weight: 750; margin: 0; margin-right: auto; }
.bar p { flex-basis: 100%; margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.group { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 600 11.5px var(--mono); padding: 6px 10px; border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: 12px var(--mono); padding: 6px 8px; min-height: 32px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); max-width: 100%; }
#path { width: 15rem; }
.stage { display: flex; justify-content: center; min-width: 0; overflow-x: auto; }
iframe { display: block; width: 100%; height: 1180px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.phone iframe { width: 375px; max-width: 100%; height: 1500px; border-radius: 28px; border-width: 8px; border-color: var(--ink); }
</style>
<div class="wrap">
    <div class="bar">
        <h1>404 incident report preview</h1>
        <div class="group">Width
            <span class="seg" role="group" aria-label="Width"><button type="button" id="w-desk" aria-pressed="true">Desktop</button><button type="button" id="w-phone" aria-pressed="false">Phone 375</button></span>
        </div>
        <div class="group">Theme
            <span class="seg" role="group" aria-label="Theme"><button type="button" id="t-light" aria-pressed="true">Light</button><button type="button" id="t-dark" aria-pressed="false">Dark</button></span>
        </div>
        <label class="group" for="path">Path <input id="path" value="/blog/sql-tips" spellcheck="false" autocomplete="off"></label>
        <label class="group" for="ref">Came from
            <select id="ref">
                <option value="">Typed or bookmark</option>
                <option value="https://loganmansfield.org/projects">A link on the site</option>
                <option value="https://www.example.com/">Another site</option>
            </select>
        </label>
        <p>The real page from the branch, with the site's own styles. Run is simulated here (simple queries on site_pages only); the live page runs DuckDB in the browser. Links don't navigate in the preview, and the walking owl is left out.</p>
    </div>
    <div class="stage" id="stage"><iframe id="frame" title="404 page preview"></iframe></div>
</div>
<script>
(function () {
    var PAGE = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>404 \u00b7 Row not found \u00b7 Logan Mansfield<\/title>\n    <meta name=\"description\" content=\"Incident report: that page isn't in the table. Head back to Logan Mansfield's portfolio.\">\n    <meta name=\"robots\" content=\"noindex\">\n    <meta property=\"og:title\" content=\"404 \u00b7 Row not found \u00b7 Logan Mansfield\">\n    <meta property=\"og:description\" content=\"Incident report: that page isn't in the table. Head back to the portfolio.\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:url\" content=\"https://loganmansfield.org/404\">\n    <meta property=\"og:image\" content=\"https://loganmansfield.org/assets/share-card.jpg\">\n    <meta property=\"og:image:type\" content=\"image/jpeg\">\n    <meta property=\"og:image:width\" content=\"1200\">\n    <meta property=\"og:image:height\" content=\"627\">\n    <meta property=\"og:image:alt\" content=\"Logan Mansfield, IT Analyst in Tampa, FL, moving into analytics engineering. loganmansfield.org\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:image\" content=\"https://loganmansfield.org/assets/share-card.jpg\">\n    <meta name=\"twitter:image:alt\" content=\"Logan Mansfield, IT Analyst in Tampa, FL, moving into analytics engineering. loganmansfield.org\">\n    <meta name=\"twitter:site\" content=\"@StatBird\">\n    <meta name=\"theme-color\" media=\"(prefers-color-scheme: light)\" content=\"#f5f6f4\">\n    <meta name=\"theme-color\" media=\"(prefers-color-scheme: dark)\" content=\"#0c1215\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap\" rel=\"stylesheet\">\n<style>/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * tokens.css \u2014 design tokens for loganmansfield.org.\n *\n * Direction: \"Pipeline\". A calm, readable data-engineering look: the\n * page reads like a well-run pipeline, with one moving moment (the Home\n * hero, where points of data are ingested, swirl into an owl, and settle\n * into the name). Everything else stays quiet: sentence-case headings in\n * Schibsted Grotesk, JetBrains Mono for numbers, labels, dates and SQL,\n * thin cool-grey lines, small radii, soft shadows, a teal accent for\n * what's \"served\" and an amber mid-pipeline accent used only as a fill.\n * Day (off-white) is the default; Night (deep blue-black) follows\n * prefers-color-scheme: dark.\n *\n * Every page imports this BEFORE any other stylesheet.\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\n:root {\n    color-scheme: light;\n\n    /* \u2500\u2500 Ground \u2500\u2500 */\n    --bg:               #f5f6f4;     /* page: cool off-white */\n    --surface-1:        #ffffff;     /* raised panels */\n    --surface-2:        #eceeeb;     /* sunken / hover / chips */\n    --surface-3:        #e1e4e1;     /* deeper hover, pressed */\n\n    /* \u2500\u2500 Ink \u2500\u2500 */\n    --ink-1:            #111b22;     /* primary text (16:1 on --bg) */\n    --ink-2:            #36424b;     /* secondary text (10:1) */\n    --ink-3:            #4a5660;     /* labels, meta (>= 6.4:1 on every surface) */\n\n    /* \u2500\u2500 Teal: the \"served\" color \u2500\u2500 */\n    --accent:           #0f6f62;     /* fills: primary button, active nav, markers (white text on it 6:1) */\n    --accent-ink:       #0f6f62;     /* teal as text (>= 5.6:1 on the page, panels and chips) */\n    --on-accent:        #ffffff;     /* text on an accent fill */\n    --accent-on-dark:   #4fd1b8;     /* teal on the dark readout band */\n    --accent-soft:      #cfe9e3;     /* light teal fill behind ink text (14:1) */\n    --accent-mist:      #e6f3f0;     /* faint teal wash for hover rows */\n    --accent-glow:      rgba(15, 111, 98, 0.14);\n\n    /* \u2500\u2500 Pipeline points (hero canvas): ingest grey, transform amber, serve teal \u2500\u2500 */\n    --pipe-1:           #8a97a3;\n    --pipe-2:           #c97a00;\n    --pipe-3:           #0f7b6c;\n\n    /* \u2500\u2500 Legacy role names (kept so every stylesheet keeps working) \u2500\u2500 */\n    --tan:              #c97a00;     /* identity fill: marks, featured stripe (fill only, ink text on it) */\n    --on-tan:           #111b22;\n    --caramel:          #0f6f62;     /* display accents as text */\n    --chestnut:         #36424b;     /* labels and eyebrows */\n    --warn:             #9a4d00;     /* warning text (stale data) */\n    --umber:            #111b22;     /* inverted band: footer, readouts */\n    --on-umber:         #e8eef0;\n    --fawn:             #eceeeb;\n    --plume:            #a3adb5;     /* texture / disabled only, never text */\n\n    /* \u2500\u2500 Signal \u2500\u2500 */\n    --success:          #1a7f37;\n    --danger:           #c62828;\n\n    /* \u2500\u2500 Lines: thin and cool \u2500\u2500 */\n    --bw:               1px;         /* default border width */\n    --bw-heavy:         2px;         /* section rules, top bar */\n    --hairline:         #d3d8d6;     /* card and panel outlines */\n    --hairline-strong:  #7d8a86;     /* control borders (3:1 on white) */\n    --rule-soft:        #e1e4e1;     /* inner table/grid lines only */\n    --focus-ring:       #0f6f62;\n    --scrim:            rgba(17, 27, 34, 0.6);   /* modal backdrop */\n\n    /* \u2500\u2500 Shadows: soft and low \u2500\u2500 */\n    --shadow-color: rgba(17, 27, 34, 0.08);\n    --shadow-sm:  0 1px 2px rgba(17, 27, 34, 0.06);\n    --shadow-md:  0 1px 2px rgba(17, 27, 34, 0.05), 0 4px 12px rgba(17, 27, 34, 0.05);\n    --shadow-lg:  0 2px 4px rgba(17, 27, 34, 0.05), 0 10px 28px rgba(17, 27, 34, 0.08);\n    --shadow-press: 0 1px 2px rgba(17, 27, 34, 0.08);\n    --shadow-pressed: 0 0 0 rgba(17, 27, 34, 0);\n\n    /* \u2500\u2500 Type \u2500\u2500 */\n    --font-display: \"Schibsted Grotesk\", \"Helvetica Neue\", Arial, system-ui, sans-serif;\n    --font-text:    \"Schibsted Grotesk\", \"Helvetica Neue\", Arial, system-ui, sans-serif;\n    --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n    --display-stretch: 100%;\n\n    /* \u2500\u2500 Radii: small and consistent \u2500\u2500 */\n    --r-sm:   6px;\n    --r-md:   10px;\n    --r-lg:   14px;\n    --r-xl:   18px;\n    --r-pill: 999px;\n\n    /* \u2500\u2500 Motion \u2500\u2500 */\n    --ease-out:    cubic-bezier(0.2, 0.8, 0.2, 1);\n    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n    --dur-fast:    120ms;\n    --dur-base:    180ms;\n    --dur-slow:    320ms;\n\n    /* \u2500\u2500 Layout \u2500\u2500 */\n    --top-bar-h:   64px;\n    --gutter:      clamp(1rem, 4vw, 2rem);\n    --max-w:       1080px;\n}\n\n/* \u2500\u2500 Night: deep blue-black \u2500\u2500\n * The same pipeline with brighter teal and amber so both read on the dark page. */\n@media __SCHEME__ {\n    :root {\n        color-scheme: dark;\n\n        --bg:               #0c1215;\n        --surface-1:        #131b20;\n        --surface-2:        #1b252b;\n        --surface-3:        #243038;\n\n        --ink-1:            #e8eef0;     /* 15:1 on --bg */\n        --ink-2:            #c3ccd0;\n        --ink-3:            #a1adb3;     /* >= 6:1 on every surface */\n\n        --accent:           #4fd1b8;\n        --accent-ink:       #4fd1b8;     /* 9:1 on cards */\n        --on-accent:        #0c1215;\n        --accent-on-dark:   #4fd1b8;\n        --accent-soft:      #1f3a36;     /* dark teal fill behind light text */\n        --accent-mist:      #16252a;\n        --accent-glow:      rgba(79, 209, 184, 0.16);\n\n        --pipe-1:           #5c6a73;\n        --pipe-2:           #f0a73a;\n        --pipe-3:           #4fd1b8;\n\n        --tan:              #f0a73a;\n        --on-tan:           #0c1215;\n        --caramel:          #4fd1b8;\n        --chestnut:         #c3ccd0;\n        --warn:             #f0a73a;\n        --umber:            #070b0d;\n        --on-umber:         #e8eef0;\n        --fawn:             #1b252b;\n        --plume:            #5c6a73;\n\n        --success:          #6fd08c;\n        --danger:           #ff8a80;\n\n        --hairline:         #2a353b;\n        --hairline-strong:  #6b7a82;\n        --rule-soft:        #243038;\n        --focus-ring:       #4fd1b8;\n        --scrim:            rgba(0, 0, 0, 0.7);\n\n        --shadow-color: rgba(0, 0, 0, 0.4);\n        --shadow-sm:  0 1px 2px rgba(0, 0, 0, 0.35);\n        --shadow-md:  0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.25);\n        --shadow-lg:  0 2px 4px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);\n        --shadow-press: 0 1px 2px rgba(0, 0, 0, 0.4);\n        --shadow-pressed: 0 0 0 rgba(0, 0, 0, 0);\n    }\n}\n\n/* \u2500\u2500\u2500 Base reset + page chrome \u2500\u2500\u2500 */\n*,\n*::before,\n*::after {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\nhtml {\n    background-color: var(--bg);\n    -webkit-text-size-adjust: 100%;\n    scroll-behavior: smooth;\n}\n\nbody {\n    background: var(--bg);\n    color: var(--ink-1);\n    font-family: var(--font-text);\n    font-size: 1rem;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n}\n\nimg, svg { max-width: 100%; }\n\na { color: var(--accent-ink); }\n\n::selection {\n    background: var(--accent);\n    color: var(--on-accent);\n}\n\n/* Page transitions (classes toggled by transition.js) */\nmain {\n    transition: opacity 0.5s ease-in-out;\n}\n\n.page-exit {\n    opacity: 0;\n}\n\n/* First load paints immediately (no fade), so the hero is the first thing on\n * screen; only in-site page swaps fade. */\n.page-enter {\n    animation: page-fade-in 0.5s ease-out forwards;\n}\n\n@keyframes page-fade-in {\n    from { opacity: 0; }\n    to   { opacity: 1; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n    html { scroll-behavior: auto; }\n    main { transition: none; }\n    .page-enter { animation-duration: 1ms; }\n}\n\n/* Scrollbar on-palette */\n::-webkit-scrollbar { width: 10px; }\n::-webkit-scrollbar-track { background: var(--surface-1); }\n::-webkit-scrollbar-thumb { background: var(--plume); border-radius: var(--r-pill); border: 2px solid var(--surface-1); }\n::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * shell.css \u2014 site chrome: top bar, nav, footer,\n * focus rings, view transitions and a11y utilities.\n *\n * Loaded after tokens.css on every page. Page content lives in pages.css.\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\nbody {\n    position: relative;\n    min-height: 100vh;\n    overflow-x: hidden;\n    display: flex;\n    flex-direction: column;\n}\n\n/* \u2500\u2500\u2500 Background: flat concrete. The decorative wash and speckle are\n *     retired; .shell-bg stays in the markup as an empty layer. \u2500\u2500\u2500 */\nbody > .shell-bg { display: none; }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Top app bar: an opaque strip with a heavy bottom rule\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nheader.topbar {\n    position: sticky;\n    top: 0;\n    z-index: 50;\n    height: var(--top-bar-h);\n    display: flex;\n    align-items: stretch;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: 0 var(--gutter);\n    background: var(--bg);\n    border-bottom: var(--bw) solid var(--hairline);\n}\nheader.topbar .topbar__brand {\n    display: flex;\n    align-items: center;\n    font-family: var(--font-display);\n    font-weight: 800;\n    font-stretch: var(--display-stretch);\n    letter-spacing: 0;\n    font-size: 0.95rem;\n    color: var(--ink-1);\n}\nheader.topbar .topbar__brand a {\n    color: inherit;\n    text-decoration: none;\n    display: flex;\n    align-items: center;\n    gap: 0.7rem;\n    padding: 0.35rem 0.5rem 0.35rem 0;\n}\nheader.topbar .topbar__brand a:hover { color: var(--accent-ink); }\n\n/* Brand mark: the logo icon, painted via CSS mask so it takes any color,\n * in a small rounded teal block. */\nheader.topbar .topbar__brand .brand-mark {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 36px;\n    height: 36px;\n    background: var(--accent);\n    color: var(--on-accent);\n    border: 0;\n    border-radius: var(--r-sm);\n}\n.crow-mark {\n    display: block;\n    background-color: currentColor;\n    -webkit-mask: url(\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAEOCAYAAAD4ws62AABdvUlEQVR4nO2deZxcZZX3f+c8996q7mzdWQhhSdIJRIGoqKgj4gDuo+MyalAgSYegjKAIjCiuU93KiOIIKouILOkkwJiMo+O4ywxugy+KIyKLBJLu7IQsvaS7q+7ynPP+cW91Kk0n6SS99/P9fEJIV/Wtp6ru/d3znJXgcDhGPqqkAM5bu5bXLlokINLKh9+yTnMnBG3HxYkcp4F/DJJkEoHzSjAEKAzHKkmowjFIYwIXFWgzSbJlxcnTNvd+rUVrwWsWQYgIAPZ7rbEEDfcCHA7HQVClQgOosZGk8sdLnmifZnJ0qrKcRoSZAj2GFCcp9CSAjyVCDqrccxhAiSAArCrFgEYE7AHRkyr6uBKeJqYtANavnFOzvvK1CoUCNzY0aG/RHQs4AXQ4RiKq6bWZiU6hUOBnLrz8hcbns5nNKQo9XgWv8PK5E8kYQBUqChULtRaqCmiFXlF2OFB61ROBmEHGgJghYQixyW5VPMnAn5TpMUrkdyvmT/3LgdY0FnAC6HCMJFSpUmDev/7ZmYEXvJngnaNqTwHwymDCJFZrIUkMG8eK/beoqdRl/+198MpnasVfBBB5HrHngY2HqKtTiPlPKvIgmO/39+pv71xYs+dA6xytOAF0OEYCvQRlyfo9s8H0bkP0TgFe7ldPmKRJDBtFANSqZnZc5qQboDWolgWRiE2QA4hgS6XtIH5YVX4C4/9g5ewJW3vWnD551AqhE0CHYzjpJSIXbNgzx2euh+BdyjjFr6rK21IIEStAaqlhIEXvwOvqEUP2PDZ+gKRY7AbpX6C8Vk38bytnTx/1QugE0OEYLiqsvos3tU2NLN5vSJco0UtNLp+zYQgVkSETvQOvUxVQZmbO5ZCEpRIUj5Dgbltlvr961qTnAKCgyo3p+xk1QugE0OEYDjLxW/SYBhMmtZ8toh8jNq8xvj/RxtHIEL7eVAqhH0DiuMuq/J5Uv0Co+V1THZUAoFBQ7h21HqmMnA/X4RgPVGwXL9y1a7LpoEtB5qMm8I9TayHWjjzh601ZCI1hYgNJoucEdB/7fNuK4yY9ReXItSo3AiM6fWbkfsgOx1ijYst70eb2V9lEP0yE97DnV9skFkofHz3XpGrZR5jue23yFMissBT/cPWJUx9HhRACwEgUw9HzYTsco5mKLW9+Qut7mfhTHAQLJY6hYpWIR++1qKpp2NgARJAkeRKQ+4TwgAa1f1o9i7rKTx1pYjh6P3SHY7SQid9b1q3LHZub/iFR/ozxgxkSR4LRZvUdjEwIyRiQMZA \n        align-items: stretch;\n        margin-left: auto;\n        border-left: var(--bw) solid var(--hairline);\n    }\n    .topnav a {\n        display: flex;\n        align-items: center;\n        padding: 0 1.15rem;\n        font-family: var(--font-text);\n        font-size: 0.95rem;\n        font-weight: 600;\n        letter-spacing: 0;\n        color: var(--ink-1);\n        text-decoration: none;\n        border-right: var(--bw) solid var(--hairline);\n        transition: background var(--dur-fast) linear, color var(--dur-fast) linear;\n    }\n    .topnav a:hover { background: var(--surface-2); color: var(--accent-ink); }\n    .topnav a[aria-current=\"page\"] {\n        color: var(--accent-ink);\n        background: transparent;\n        box-shadow: inset 0 -2px 0 var(--accent);\n    }\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Burger button (mobile)\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.burger {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-self: center;\n    gap: 5px;\n    width: 44px;\n    height: 44px;\n    padding: 10px;\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline-strong);\n    border-radius: var(--r-sm);\n    cursor: pointer;\n    color: var(--ink-1);\n    box-shadow: var(--shadow-sm);\n    transition: transform var(--dur-fast) linear, box-shadow var(--dur-fast) linear;\n    flex-shrink: 0;\n}\n.burger:hover { background: var(--surface-2); }\n.burger:active { transform: translateY(1px); box-shadow: none; }\n.burger__bar {\n    display: block;\n    width: 100%;\n    height: 2px;\n    border-radius: 2px;\n    background: currentColor;\n    transform-origin: center;\n    transition:\n        transform 200ms var(--ease-out),\n        opacity 160ms var(--ease-out);\n}\nbody.site-nav-open .burger .burger__bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }\nbody.site-nav-open .burger .burger__bar:nth-child(2) { opacity: 0; transform: scaleX(0); }\nbody.site-nav-open .burger .burger__bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }\n@media (min-width: 768px) {\n    .burger { display: none; }\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Mobile dropdown nav: a full-width slab under the bar\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.site-nav {\n    position: fixed;\n    z-index: 90;\n    pointer-events: none;\n}\n.site-nav__backdrop {\n    position: fixed;\n    inset: 0;\n    background: transparent;\n}\n.site-nav__panel {\n    position: fixed;\n    top: var(--top-bar-h);\n    left: 0;\n    right: 0;\n    background: var(--surface-1);\n    border-bottom: var(--bw) solid var(--hairline);\n    box-shadow: var(--shadow-lg);\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    transform-origin: top center;\n    transform: translateY(-8px);\n    opacity: 0;\n    visibility: hidden;\n    pointer-events: none;\n    transition:\n        transform 160ms var(--ease-out),\n        opacity 140ms linear,\n        visibility 0s linear 160ms;\n}\nbody.site-nav-open .site-nav { pointer-events: auto; }\nbody.site-nav-open .site-nav__panel {\n    transform: translateY(0);\n    opacity: 1;\n    visibility: visible;\n    pointer-events: auto;\n    transition:\n        transform 160ms var(--ease-out),\n        opacity 140ms linear,\n        visibility 0s;\n}\n@media (prefers-reduced-motion: reduce) {\n    .site-nav__panel { transition: opacity 120ms linear, visibility 0s linear 120ms; transform: none; }\n    body.site-nav-open .site-nav__panel { transition: opacity 120ms linear, visibility 0s; }\n}\n.site-nav__item {\n    display: block;\n    padding: 1rem var(--gutter);\n    font-family: var(--font-text);\n    font-size: 1.05rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    text-decoration: none;\n    border-top: var(--bw) solid var(--hairline);\n}\n.site-nav__item:first-child { border-top: 0; }\n.site-nav__item:hover { color: var(--accent-ink); background: var(--surface-2); }\n.site-nav__item[aria-current=\"page\"] { color: var(--accent-ink); background: var(--accent-mist); box-shadow: inset 3px 0 0 var(--accent); }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Footer: a dark band under a thin teal rule\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfooter.shell-footer {\n    margin-top: auto;\n    background: var(--umber);\n    color: var(--on-umber);\n    border-top: 2px solid var(--accent);\n    padding: 1.6rem var(--gutter) calc(1.6rem + env(safe-area-inset-bottom, 0px));\n    position: relative;\n    z-index: 1;\n}\nfooter.shell-footer .footer-inner {\n    max-width: var(--max-w);\n    margin: 0 auto;\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    justify-content: space-between;\n    gap: 0.9rem 1.5rem;\n}\nfooter.shell-footer .footer-brand {\n    display: flex;\n    align-items: center;\n    gap: 0.6rem;\n    font-family: var(--font-mono);\n    font-size: 0.78rem;\n    color: var(--on-umber);\n}\nfooter.shell-footer .footer-brand .crow-mark { width: 22px; height: 18px; color: var(--accent-on-dark); }\nfooter.shell-footer .footer-socials {\n    display: flex;\n    gap: 0;\n    flex-wrap: wrap;\n}\nfooter.shell-footer .footer-socials a {\n    color: var(--on-umber);\n    text-decoration: none;\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    font-weight: 600;\n    padding: 0.55rem 0.85rem;\n    border: var(--bw) solid color-mix(in srgb, var(--on-umber) 30%, transparent);\n    border-radius: var(--r-sm);\n    margin: 0 0.4rem 0.4rem 0;\n    transition: background var(--dur-fast) linear, color var(--dur-fast) linear;\n}\nfooter.shell-footer .footer-socials a:hover {\n    color: var(--accent-on-dark);\n    border-color: var(--accent-on-dark);\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Focus ring (global)\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\na:focus-visible,\nbutton:focus-visible,\nsummary:focus-visible {\n    outline: 3px solid var(--focus-ring);\n    outline-offset: 2px;\n    border-radius: var(--r-sm);\n}\n.topnav a:focus-visible { outline-offset: -5px; }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * View Transitions API \u2014 persistent shell stays put while the page\n * content cross-fades. Browsers without support use the fade in\n * transition.js.\n *\n * Full page loads between pages (e.g. to and from 404) fade too. The\n * opt-in has to be in a render-blocking stylesheet: the inbound page is\n * checked for it at its first render, before deferred scripts run.\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@media (prefers-reduced-motion: no-preference) {\n    @view-transition { navigation: auto; }\n}\n\n@supports (view-transition-name: a) {\n    header.topbar .topbar__brand { view-transition-name: nav-brand; }\n    main                         { view-transition-name: page-main; }\n    footer.shell-footer          { view-transition-name: page-footer; }\n\n    ::view-transition-old(page-main) {\n        animation: vt-fade-out var(--dur-base) var(--ease-out) both;\n    }\n    ::view-transition-new(page-main) {\n        animation: vt-fade-up var(--dur-slow) var(--ease-out) both;\n    }\n    ::view-transition-old(page-footer),\n    ::view-transition-new(page-footer),\n    ::view-transition-old(nav-brand),\n    ::view-transition-new(nav-brand) {\n        animation-duration: 0s;\n    }\n\n    @keyframes vt-fade-out  { to { opacity: 0; } }\n    @keyframes vt-fade-up   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n    @media (prefers-reduced-motion: reduce) {\n        ::view-transition-old(*),\n        ::view-transition-new(*) {\n            animation-duration: 0s !important;\n        }\n    }\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * A11y utilities\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.skip-link {\n    position: fixed;\n    top: 8px;\n    left: 8px;\n    z-index: 1000;\n    background: var(--accent);\n    color: var(--on-accent);\n    padding: 0.6rem 1rem;\n    border: var(--bw) solid var(--hairline);\n    font-family: var(--font-mono);\n    font-size: 0.82rem;\n    font-weight: 600;\n    text-decoration: none;\n    transform: translateY(-200%);\n    transition: transform var(--dur-fast) var(--ease-out);\n}\n.skip-link:focus {\n    transform: translateY(0);\n    outline: 2px solid var(--ink-1);\n    outline-offset: 2px;\n}\n\n.visually-hidden,\n.sr-only {\n    position: absolute;\n    width: 1px;\n    height: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip: rect(0, 0, 0, 0);\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n}\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * pages.css \u2014 page content patterns.\n *\n *   main.page          page wrapper\n *   .hero              top-of-page intro (card variant on Home)\n *   .now               three-line \"now\" strip (Home)\n *   .section-head      thin rule + numbered stage title + optional hint\n *   .project           project card (+ --featured numbered ledger rows)\n *   .xp                experience ledger (dates in their own column)\n *   .chip-list / .chip skills, stack, credentials\n *   .toolkit           chip lists grouped under small uppercase labels (Home)\n *   .about, .socials   about copy + connect cards\n *   .wf-divider        retired divider (markup kept, not drawn)\n *   .btn               small rounded buttons (+ .btn__meta small suffix, e.g. \"PDF\")\n *   .sql-src           collapsed, runnable \"SQL source\" caption under a data-backed piece\n * \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\nmain.page {\n    width: 100%;\n    max-width: var(--max-w);\n    margin: 0 auto;\n    padding: clamp(1.75rem, 5vw, 3.25rem) var(--gutter) clamp(3rem, 7vw, 5rem);\n    display: grid;\n    grid-template-columns: minmax(0, 1fr);\n    gap: clamp(2.75rem, 6vw, 4.5rem);\n    position: relative;\n    z-index: 1;\n    counter-reset: sec;\n}\nmain.page > * { min-width: 0; }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Type helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n/* Eyebrow: a small mono stage label in teal. */\n.eyebrow {\n    justify-self: start;\n    display: inline-block;\n    font-family: var(--font-mono);\n    font-size: 0.74rem;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--accent-ink);\n    background: var(--accent-mist);\n    border-radius: var(--r-sm);\n    padding: 0.28rem 0.55rem;\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Buttons: small rounded blocks with a soft shadow \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.55rem;\n    min-height: 44px;\n    padding: 0.7rem 1.1rem;\n    border-radius: var(--r-sm);\n    font-family: var(--font-text);\n    font-weight: 600;\n    font-size: 0.95rem;\n    letter-spacing: 0;\n    line-height: 1;\n    text-decoration: none;\n    cursor: pointer;\n    border: var(--bw) solid var(--hairline);\n    box-shadow: var(--shadow-press);\n    white-space: nowrap;\n    transition: transform var(--dur-fast) linear,\n                background var(--dur-fast) linear,\n                box-shadow var(--dur-fast) linear,\n                color var(--dur-fast) linear;\n}\n.btn--primary {\n    background: var(--accent);\n    color: var(--on-accent);\n}\n.btn--ghost {\n    background: var(--surface-1);\n    color: var(--ink-1);\n}\n.btn--ghost:hover { background: var(--surface-2); color: var(--ink-1); border-color: var(--hairline-strong); }\n.btn--primary { border-color: var(--accent); }\n.btn--primary:hover { background: var(--ink-1); border-color: var(--ink-1); color: var(--bg); }\n.btn:active { transform: translateY(1px); box-shadow: var(--shadow-pressed); }\n.btn .arrow { font-family: var(--font-mono); font-weight: 600; }\n.btn__meta {\n    font-size: 0.7rem;\n    font-weight: 600;\n    padding: 0.12rem 0.3rem;\n    border: 1px solid currentColor;\n    border-radius: 4px;\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Hero \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.hero {\n    display: grid;\n    gap: 1.75rem;\n}\n.hero__main {\n    display: grid;\n    gap: 1.1rem;\n    justify-items: start;\n}\n/* Pipeline stage (Home): points flow through ingest, transform and serve,\n * swirl into an owl, then settle into the name. Drawn by hero-pipeline.js;\n * shipped `hidden`, so without JS the plain <h1> shows instead. */\n.hero-pipe {\n    position: relative;\n    height: clamp(300px, 40vw, 420px);\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline);\n    border-radius: var(--r-lg);\n    box-shadow: var(--shadow-md);\n    overflow: hidden;\n}\n.hero-pipe[hidden] { display: none; }\n.hero-pipe__canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }\n.hero-pipe__labels {\n    position: absolute;\n    inset: 0 0 auto;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    pointer-events: none;\n}\n/* Each stage label is a link to the project that does that step. */\n.hero-pipe__stage {\n    pointer-events: auto;\n    display: flex;\n    flex-direction: column;\n    gap: 0.1rem;\n    padding: 0.7rem 0.9rem;\n    color: var(--ink-2);\n    text-decoration: none;\n    border-radius: var(--r-md);\n    transition: background-color var(--dur-fast, 0.15s) ease;\n}\n.hero-pipe__stage:nth-child(2) { align-items: center; text-align: center; }\n.hero-pipe__stage:nth-child(3) { align-items: flex-end; text-align: right; }\n.hero-pipe__stage:hover,\n.hero-pipe__stage:focus-visible { background: var(--accent-mist); }\n.hero-pipe__kind {\n    font: 600 0.7rem/1.3 var(--font-mono);\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n}\n.hero-pipe__stage:nth-child(3) .hero-pipe__kind { color: var(--accent-ink); }\n.hero-pipe__what {\n    font: 650 0.86rem/1.25 var(--font-text);\n    color: var(--ink-1);\n    text-decoration: underline;\n    text-decoration-color: var(--hairline-strong);\n    text-underline-offset: 3px;\n}\n.hero-pipe__stage:hover .hero-pipe__what { text-decoration-color: var(--accent); }\n.hero-pipe__num {\n    font: 500 0.72rem/1.3 var(--font-mono);\n    color: var(--ink-3);\n    min-height: 1.3em;\n    font-variant-numeric: tabular-nums;\n}\n.hero-pipe__num.is-fraud { color: var(--warn); }\n.hero-pipe__note {\n    position: absolute;\n    left: 0.9rem;\n    bottom: 0.8rem;\n    right: 6.5rem;\n    margin: 0;\n    font: 500 0.68rem/1.35 var(--font-mono);\n    color: var(--ink-3);\n    pointer-events: none;\n}\n.hero-pipe__note[hidden] { display: none; }\n@media (max-width: 639px) {\n    .hero-pipe__stage { padding: 0.55rem 0.5rem; }\n    .hero-pipe__what { font-size: 0.76rem; }\n    .hero-pipe__num { font-size: 0.66rem; }\n    .hero-pipe__note { left: 0.6rem; right: 5.5rem; bottom: 0.6rem; font-size: 0.62rem; }\n}\n.hero-pipe__replay {\n    position: absolute;\n    right: 0.6rem;\n    bottom: 0.6rem;\n    min-height: 36px;\n    padding: 0.4rem 0.75rem;\n    font: 600 0.78rem/1 var(--font-mono);\n    letter-spacing: 0.04em;\n    color: var(--ink-2);\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline-strong);\n    border-radius: var(--r-sm);\n    cursor: pointer;\n}\n.hero-pipe__replay:hover { color: var(--accent-ink); border-color: var(--accent); }\n.hero-pipe__replay[hidden] { display: none; }\n.hero--pipe .hero__avatar {\n    width: clamp(84px, 15vw, 140px);\n    height: clamp(84px, 15vw, 140px);\n}\n/* Once the stage draws the name, the <h1> stays for screen readers and search only. */\n.hero--pipe .hero__name {\n    position: absolute;\n    width: 1px;\n    height: 1px;\n    margin: -1px;\n    padding: 0;\n    overflow: hidden;\n    clip: rect(0 0 0 0);\n    clip-path: inset(50%);\n    white-space: nowrap;\n}\n\n/* Home masthead: the intro with the photo beside it (the big name is the pipeline stage when JS runs). */\n.hero__card {\n    display: grid;\n    grid-template-columns: 1fr;\n    justify-items: start;\n    gap: clamp(1.25rem, 4vw, 2rem);\n    position: relative;\n}\n.hero__intro {\n    display: grid;\n    justify-items: start;\n    gap: 1.25rem;\n    min-width: 0;\n}\n.hero__avatar {\n    display: block;\n    width: clamp(120px, 22vw, 208px);\n    height: clamp(120px, 22vw, 208px);\n    border-radius: var(--r-lg);\n    object-fit: cover;\n    border: var(--bw) solid var(--hairline);\n    box-shadow: var(--shadow-md);\n    background: var(--surface-2);\n}\n.hero__name {\n    font-family: var(--font-display);\n    font-size: clamp(2.2rem, 7.6vw, 5.75rem);\n    line-height: 0.98;\n    letter-spacing: -0.025em;\n    font-weight: 800;\n    font-stretch: var(--display-stretch);\n    color: var(--ink-1);\n    max-width: 100%;\n}\n.page-home .hero__name { font-size: clamp(2.25rem, 8.4vw, 6.25rem); }\n.hero__role {\n    font-size: clamp(1.05rem, 2.2vw, 1.3rem);\n    line-height: 1.45;\n    color: var(--ink-1);\n    max-width: 60ch;\n}\n.hero__role em {\n    color: var(--ink-1);\n    font-style: normal;\n    font-weight: 700;\n    background: var(--accent-soft);\n    border-radius: 4px;\n    padding: 0 0.2em;\n    box-decoration-break: clone;\n    -webkit-box-decoration-break: clone;\n}\n.hero__availability {\n    display: inline-flex;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 0.5rem;\n    font-family: var(--font-mono);\n    font-size: 0.82rem;\n    font-weight: 600;\n    color: var(--ink-2);\n}\n.hero__availability-dot {\n    width: 10px;\n    height: 10px;\n    background: var(--success);\n    flex-shrink: 0;\n    animation: now-blink 1.6s steps(2, jump-none) infinite;\n}\n@keyframes now-blink {\n    0%   { opacity: 1; }\n    100% { opacity: 0.25; }\n}\n@media (prefers-reduced-motion: reduce) {\n    .hero__availability-dot { animation: none; }\n}\n.contact-row {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 0.75rem;\n    align-items: center;\n    margin-top: 0.35rem;\n}\n\n@media (min-width: 720px) {\n    .hero__card {\n        grid-template-columns: minmax(0, 1fr) auto;\n        align-items: end;\n        gap: clamp(1.75rem, 4vw, 3rem);\n    }\n    .hero__card > .hero__avatar { grid-column: 2; grid-row: 1; align-self: start; }\n    .hero__card > .hero__intro { grid-column: 1; grid-row: 1; }\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Now strip: a dark readout panel \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.now {\n    display: grid;\n    gap: 0;\n    background: var(--umber);\n    color: var(--on-umber);\n    border: var(--bw) solid var(--umber);\n    border-radius: var(--r-lg);\n    overflow: hidden;\n    box-shadow: var(--shadow-md);\n}\n.now__row {\n    display: grid;\n    grid-template-columns: 6.5rem minmax(0, 1fr);\n    gap: 0.9rem;\n    align-items: baseline;\n    padding: 0.9rem 1.1rem;\n    border-bottom: var(--bw) solid color-mix(in srgb, var(--on-umber) 16%, transparent);\n}\n.now__row:last-child { border-bottom: 0; }\n.now__label {\n    font-family: var(--font-mono);\n    font-size: 0.74rem;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--accent-on-dark);\n}\n.now__value { color: var(--on-umber); font-size: 0.95rem; }\n.now__value a {\n    color: var(--on-umber);\n    font-weight: 600;\n    text-decoration: underline;\n    text-decoration-color: var(--accent-on-dark);\n    text-decoration-thickness: 1.5px;\n    text-underline-offset: 3px;\n}\n.now__value a:hover { color: var(--accent-on-dark); }\n@media (min-width: 720px) {\n    .now { grid-template-columns: repeat(3, 1fr); }\n    .now__row {\n        grid-template-columns: 1fr;\n        gap: 0.4rem;\n        border-bottom: 0;\n        border-right: var(--bw) solid color-mix(in srgb, var(--on-umber) 16%, transparent);\n        padding: 1rem 1.25rem;\n    }\n    .now__row:last-child { border-right: 0; }\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Section heading: a thin rule and a numbered stage title \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.section-head {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 0.75rem 1rem;\n    flex-wrap: wrap;\n    margin-bottom: 1.4rem;\n    padding-top: 1rem;\n    border-top: var(--bw) solid var(--hairline);\n}\n.section-head__title {\n    counter-increment: sec;\n    display: flex;\n    align-items: baseline;\n    gap: 0.75rem;\n    font-family: var(--font-display);\n    font-weight: 800;\n    font-stretch: var(--display-stretch);\n    font-size: clamp(1.5rem, 3.2vw, 2.15rem);\n    letter-spacing: -0.02em;\n    line-height: 1.05;\n    color: var(--ink-1);\n}\n.section-head__title::before {\n    content: counter(sec, decimal-leading-zero) \" \u00b7\";\n    content: counter(sec, decimal-leading-zero) \" \u00b7\" / \"\";\n    font-family: var(--font-mono);\n    font-size: 0.45em;\n    font-weight: 600;\n    font-stretch: normal;\n    letter-spacing: 0;\n    color: var(--accent-ink);\n    transform: translateY(-0.35em);\n}\n.section-head__hint {\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    color: var(--ink-3);\n}\n.section-head__link {\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    text-decoration: none;\n    padding: 0.45rem 0.75rem;\n    border: var(--bw) solid var(--hairline);\n    border-radius: var(--r-sm);\n    background: var(--surface-1);\n    box-shadow: var(--shadow-sm);\n    transition: background var(--dur-fast) linear, color var(--dur-fast) linear;\n}\n.section-head__link:hover { background: var(--surface-2); color: var(--accent-ink); }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Divider: retired \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n * Each section now opens with its own rule, so the old crow divider\n * would only double it. The markup stays (aria-hidden) and is not drawn. */\n.wf-divider { display: none; }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Projects \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.project-grid {\n    display: grid;\n    gap: 1.25rem;\n    grid-template-columns: 1fr;\n}\n@media (min-width: 640px) { .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n\n.project {\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    scroll-margin-top: calc(var(--top-bar-h) + 1rem);\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline);\n    border-radius: var(--r-lg);\n    box-shadow: var(--shadow-md);\n    transition: transform var(--dur-fast) linear,\n                box-shadow var(--dur-fast) linear;\n}\n@media (hover: hover) and (prefers-reduced-motion: no-preference) {\n    .project:not(.project--featured):hover {\n        transform: translateY(-2px);\n        box-shadow: var(--shadow-lg);\n    }\n}\n.project__body {\n    display: grid;\n    gap: 0.7rem;\n    padding: clamp(1.1rem, 3vw, 1.4rem);\n    align-content: start;\n    flex: 1;\n}\n.project__head {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 0.75rem;\n}\n.project__eyebrow {\n    font-family: var(--font-mono);\n    font-size: 0.74rem;\n    font-weight: 600;\n    letter-spacing: 0;\n    text-transform: uppercase;\n    color: var(--ink-3);\n}\n.project__date {\n    font-family: var(--font-mono);\n    font-size: 0.74rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    white-space: nowrap;\n    padding: 0.1rem 0.4rem;\n    border: var(--bw) solid var(--hairline);\n}\n.project__title {\n    font-family: var(--font-display);\n    font-weight: 800;\n    font-size: 1.4rem;\n    line-height: 1.1;\n    letter-spacing: -0.01em;\n    color: var(--ink-1);\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    gap: 0.5rem;\n}\n.project__desc {\n    color: var(--ink-2);\n    font-size: 0.97rem;\n    line-height: 1.5;\n}\n.project__desc strong { color: var(--ink-1); font-weight: 700; }\n.project__tags {\n    list-style: none;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 0.4rem;\n    margin-top: 0.15rem;\n}\n.project__tags li {\n    font-family: var(--font-mono);\n    font-size: 0.72rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    background: var(--surface-2);\n    border: var(--bw) solid var(--hairline);\n    padding: 0.18rem 0.45rem;\n    border-radius: var(--r-sm);\n}\n.project__links {\ ar(--bw) solid var(--hairline);\n    border-radius: var(--r-lg);\n    overflow: hidden;\n    box-shadow: var(--shadow-md);\n    counter-reset: feat;\n}\n.project--featured {\n    counter-increment: feat;\n    border-radius: 0;\n    border: 0;\n    border-top: var(--bw) solid var(--hairline);\n    box-shadow: none;\n    background: transparent;\n    transition: background var(--dur-fast) linear;\n}\n.project--featured:first-child { border-top: 0; }\n.project--featured:hover { background: var(--accent-mist); }\n.project--featured .project__body {\n    grid-template-columns: 2.75rem minmax(0, 1fr);\n    grid-template-areas:\n        \"num head\"\n        \"num title\"\n        \"num desc\"\n        \"num tags\"\n        \"num links\";\n    column-gap: 0.9rem;\n}\n.project--featured .project__body::before {\n    content: counter(feat, decimal-leading-zero);\n    content: counter(feat, decimal-leading-zero) / \"\";\n    grid-area: num;\n    font-family: var(--font-mono);\n    font-size: 1.35rem;\n    font-weight: 600;\n    line-height: 1;\n    color: var(--accent-ink);\n}\n.project--featured .project__head  { grid-area: head; }\n.project--featured .project__title { grid-area: title; font-size: clamp(1.5rem, 3vw, 1.95rem); }\n.project--featured .project__desc  { grid-area: desc; max-width: 62ch; }\n.project--featured .project__tags  { grid-area: tags; }\n.project--featured .project__links { grid-area: links; }\n@media (min-width: 880px) {\n    .project--featured .project__body {\n        grid-template-columns: 4.25rem minmax(0, 1.55fr) minmax(0, 1fr);\n        grid-template-areas:\n            \"num head  tags\"\n            \"num title tags\"\n            \"num desc  links\";\n        column-gap: 1.5rem;\n        padding: 1.5rem 1.6rem;\n    }\n    .project--featured .project__body::before { font-size: 2.1rem; }\n    .project--featured .project__tags { align-self: start; align-content: start; }\n    .project--featured .project__links {\n        align-self: end;\n        flex-direction: column;\n        align-items: flex-start;\n        gap: 0.55rem;\n        padding-top: 0;\n    }\n}\n\n/* Archived: quieter, with a dashed frame and no shadow */\n.project--archived {\n    background: transparent;\n    border-style: dashed;\n    box-shadow: none;\n}\n.project--archived .project__title { color: var(--ink-2); }\n\n.projects-more {\n    text-align: left;\n    color: var(--ink-2);\n    font-size: 0.95rem;\n    margin-top: 1.5rem;\n}\n.projects-more a {\n    color: var(--ink-1);\n    font-weight: 700;\n    text-decoration: underline;\n    text-decoration-color: var(--accent);\n    text-decoration-thickness: 3px;\n    text-underline-offset: 4px;\n}\n.projects-more a:hover { background: var(--accent); color: var(--on-accent); }\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Experience: a dated ledger \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.xp {\n    list-style: none;\n    display: grid;\n    gap: 0;\n    position: relative;\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline);\n    border-radius: var(--r-lg);\n    overflow: hidden;\n    box-shadow: var(--shadow-md);\n}\n.xp__item {\n    display: block;\n    position: relative;\n    border-top: var(--bw) solid var(--hairline);\n}\n.xp__item:first-child { border-top: 0; }\n.xp__rail { display: none; }\n.xp__card {\n    padding: 1.1rem 1.25rem;\n    display: grid;\n    gap: 0.4rem;\n}\n.xp__item--now .xp__card { box-shadow: inset 3px 0 0 var(--accent); }\n.xp__head {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 0.25rem 1rem;\n}\n.xp__role {\n    font-family: var(--font-display);\n    font-weight: 800;\n    font-size: 1.15rem;\n    line-height: 1.2;\n    color: var(--ink-1);\n}\n.xp__dates {\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    font-variant-numeric: tabular-nums;\n}\n.xp__org {\n    font-family: var(--font-mono);\n    font-size: 0.82rem;\n    color: var(--ink-3);\n    font-weight: 500;\n}\n.xp__desc {\n    color: var(--ink-2);\n    font-size: 0.95rem;\n    line-height: 1.55;\n    max-width: 72ch;\n}\n.xp__note {\n    font-family: var(--font-text);\n    font-weight: 500;\n    font-size: 0.88rem;\n    color: var(--ink-2);\n}\n@media (min-width: 720px) {\n    /* Dates move into their own left column, like a ledger. */\n    .xp__card {\n        grid-template-columns: 11.5rem minmax(0, 1fr);\n        column-gap: 1.5rem;\n        padding: 1.3rem 1.5rem;\n    }\n    .xp__head { display: contents; }\n    .xp__dates { grid-column: 1; grid-row: 1 / span 3; padding-top: 0.2rem; }\n    .xp__role, .xp__org, .xp__desc { grid-column: 2; }\n    .xp__role { grid-row: 1; }\n}\n.xp__item--compact .xp__card { padding-block: 0.85rem; }\n\n.section-note {\n    margin-top: 1rem;\n    font-size: 0.92rem;\n    line-height: 1.5;\n    color: var(--ink-2);\n    max-width: 60ch;\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Chips: square, mono \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.chip-list {\n    list-style: none;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 0.5rem;\n}\n.chip {\n    display: inline-flex;\n    align-items: center;\n    gap: 0.4rem;\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    font-weight: 600;\n    color: var(--ink-1);\n    background: var(--surface-1);\n    border: var(--bw) solid var(--hairline);\n    padding: 0.4rem 0.65rem;\n    border-radius: var(--r-pill);\n}\n.chip--cred {\n    font-family: var(--font-text);\n    font-size: 0.92rem;\n    font-weight: 700;\n    color: var(--bg);\n    background: var(--ink-1);\n    border-color: va
